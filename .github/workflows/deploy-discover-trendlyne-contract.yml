name: Deploy discover-trendlyne-contract

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-discover-trendlyne-contract-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Stage function in Supabase CLI layout
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .supabase-deploy
          mkdir -p .supabase-deploy/supabase/functions
          cp -R edge-functions/discover-trendlyne-contract .supabase-deploy/supabase/functions/discover-trendlyne-contract
          cat > .supabase-deploy/supabase/config.toml <<'EOF'
          [functions.discover-trendlyne-contract]
          verify_jwt = true
          EOF

      - name: Deploy discover-trendlyne-contract
        working-directory: .supabase-deploy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_PROJECT_ID"
          supabase functions deploy discover-trendlyne-contract \
            --project-ref "$SUPABASE_PROJECT_ID"
