name: Deploy refresh-market-data

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "edge-functions/refresh-market-data/**"
      - ".github/workflows/deploy-refresh-market-data.yml"

permissions:
  contents: read

concurrency:
  group: deploy-refresh-market-data-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Stage function in Supabase CLI layout
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .supabase-deploy
          mkdir -p .supabase-deploy/supabase/functions
          cp -R edge-functions/refresh-market-data .supabase-deploy/supabase/functions/refresh-market-data
          cat > .supabase-deploy/supabase/config.toml <<'EOF'
          [functions.refresh-market-data]
          verify_jwt = true
          EOF

      - name: Deploy refresh-market-data
        working-directory: .supabase-deploy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_PROJECT_ID"
          supabase functions deploy refresh-market-data \
            --project-ref "$SUPABASE_PROJECT_ID"
